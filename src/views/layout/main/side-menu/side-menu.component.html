<p-sidebar
  [appendTo]="sidebarContainer"
  [baseZIndex]="1000"
  [modal]="isMobile"
  [position]="'right'"
  [showCloseIcon]="isMobile"
  [style]="{ width: isMobile ? '80%' : '250px' }"
  [visible]="sidebarVisible"
  position="left"
  styleClass="custom-sidebar"
>
  <div>
    <div
      class="sidebar-header p-3 border-bottom-1 surface-border flex justify-between items-center"
    >
      <img alt="" src="/assets/shared/logo-horizontal.svg" />
      <div>
        <button
          (click)="closeSidebar()"
          class="close-btn text-white cursor-pointer p-link block md:hidden"
        >
          <i class="pi pi-times close-popup"></i>
        </button>
      </div>
    </div>
    <ul class="menu-list px-4 m-0 list-none">
      <li *ngFor="let item of menuItems">
        <div
          routerLinkActive="active"
          (click)="toggleSubmenu(item)"
          class="menu-item flex items-center gap-3 cursor-pointer"
          [ngClass]="!item.children ? '!p-0' : ''"
        >
          @if (item.children) {
            <img
              *ngIf="item.iconUrl"
              [src]="item.iconUrl"
              alt="{{ item.label }} icon"
              class="w-5 h-5"
            />
          }
          <a
            [routerLink]="item.routerLink"
            [title]="item.label"
            *ngIf="!item.children"
            class="flex-1 truncate block flex gap-3 items-center px-4 py-2"
          >
            <img
              *ngIf="item.iconUrl"
              [src]="item.iconUrl"
              alt="{{ item.label }} icon"
              class="w-5 h-5"
            />
            {{ item.label }}
          </a>
          <span [title]="item.label" *ngIf="item.children" class="flex-1 truncate block">{{
            item.label
          }}</span>
          <svg
            *ngIf="item.children && !isSubmenuOpen(item)"
            class="h-4 w-4 inline"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M19 9l-7 7-7-7"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
          <svg
            *ngIf="item.children && isSubmenuOpen(item)"
            class="h-4 w-4 inline"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 15l7-7 7 7"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
        </div>
        <ul *ngIf="item.children && isSubmenuOpen(item)" class="submenu list-none pl-6">
          @for (child of item.children; track child.label) {
            <li
              routerLinkActive="active"
              class="!p-0 cursor-pointer flex items-center gap-3 sub-links"
            >
              <img
                *ngIf="child.iconUrl"
                [src]="child.iconUrl"
                alt="{{ child.label }} icon"
                class="w-4 h-4"
              />
              <a
                [routerLink]="child.routerLink"
                [title]="child.label"
                class="flex-1 truncate block p-2 ps-8"
                >{{ child.label }}</a
              >
            </li>
          }
        </ul>
      </li>
    </ul>
  </div>
  <div class="px-3 absolute bottom-0 left-0 w-full">
    <button
      (click)="logout()"
      class="min-h-[32px] py-2 rounded bg-gray-100 w-full mb-2 text-[#b42318] text-sm font-medium cursor-pointer hover:bg-[#e5e7eb]"
    >
      {{ 'COMMON.LOG_OUT' | translate }}
    </button>
  </div>
</p-sidebar>
