<div dir="rtl">
  <div class="p-6">
    <button class="block ms-auto">
      <i class="pi pi-times close-popup"></i>
    </button>
    <h3 class="text-[#1f2a37] font-[600] mb-4 text-lg sm:text-xl">بيانات الطلب</h3>

    <div class="bg-[#f3f4f6] p-6 rounded-4xl">
      <div
        class="flex items-start md:tems-center gap-6 justify-between flex-col md:flex-row bg-[#fff] py-3 px-6 rounded-4xl mb-8"
      >
        <div class="flex items-center gap-2">
          <span class="text-[14px] text-[#6c737f]"> حالة الطلب</span>
          <div class="bg-[#ecfdf3] px-2 rounded-full w-fit flex items-center gap-2">
            <span class="w-[10px] h-[10px] rounded-full bg-[#085d3a] block"></span>
            <span class="text-[#085d3a] font-semibold text-sm">موافقة</span>
          </div>
          <div class="bg-[#eff8ff] px-2 rounded-full w-fit flex items-center gap-2">
            <span class="w-[10px] h-[10px] rounded-full bg-[#1849a9] block"></span>
            <span class="text-[#1849a9] font-semibold text-sm">جديد</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-[14px] text-[#6c737f]"> تاريخ الطلب</span>
          <h4 class="font-semibold text-[#161616]">2025-11-05</h4>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- National ID -->
        <div>
          <span class="text-[14px] text-[#6c737f]"> نوع الاستئذان </span>
          <h4 class="font-semibold text-[#161616]">بداية الدوام</h4>
        </div>
        <div>
          <span class="text-[14px] text-[#6c737f]"> اسم الموظف </span>
          <h4 class="font-semibold text-[#161616]">محمد أحمد طه</h4>
        </div>
        <div>
          <span class="text-[14px] text-[#6c737f]"> تاريخ الاستئذان </span>
          <h4 class="font-semibold text-[#161616]">2025-11-05</h4>
        </div>
        <div>
          <span class="text-[14px] text-[#6c737f]"> مدة الاستئذان </span>
          <h4 class="font-semibold text-[#161616]">10 ساعات</h4>
        </div>
        <div class="xl:col-span-4 lg:col-span-3 md:col-span-2">
          <span class="text-[14px] text-[#6c737f]"> بداية مدة الاستئذان </span>
          <h4 class="font-semibold text-[#161616]">02:00 م</h4>
        </div>
        <div class="xl:col-span-4 lg:col-span-3 md:col-span-2">
          <span class="text-[14px] text-[#6c737f]"> ملاحظات </span>
          <h4 class="font-semibold text-[#161616]">ملاحظات</h4>
        </div>
      </div>
    </div>

    <!-- Action Buttons - Only show for TAKE_ACTION mode -->
    <div class="actions flex items-center justify-between mt-6">
      <button class="btn gray-btn">الغاء</button>
      <div class="flex items-center gap-4">
        <button class="btn !text-[#b42318] red-btn-action">رفض الغاء طلب الاستئذان</button>
        <button class="btn green-btn">قبول الغاء طلب الاستئذان</button>
        <button class="btn green-btn">الغاء طلب الاستئذان</button>
      </div>
    </div>
  </div>
</div>
