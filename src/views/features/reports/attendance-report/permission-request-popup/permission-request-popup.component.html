<div dir="rtl">
  <div class="p-6">
    <button class="block ms-auto">
      <i class="pi pi-times close-popup"></i>
    </button>
    <h3 class="text-[#1f2a37 font-[600] mb-4 text-lg sm:text-xl">طلبات الاستئذانات</h3>
    <div class="bg-[#074d31] p-6 rounded-2xl mb-6">
      <span class="text-white text-sm">تاريخ الاستئذان</span>
      <h5 class="text-base font-semibold mt-2 text-white">12/12/2024</h5>
    </div>
    <p-table [value]="attendance">
      <ng-template #header>
        <tr>
          <th>نوع الاستئذان</th>
          <th>مدة الاستئذان</th>
          <th>الوقت - من</th>
          <th>الوقت - الى</th>
        </tr>
      </ng-template>
      <ng-template #body let-attendance>
        <tr>
          <td>بداية الدوام (للحضور المتأخر)</td>
          <td>30 دقيقة</td>
          <td>10:00</td>
          <td>11:00</td>
        </tr>
      </ng-template>
    </p-table>

    <div class="actions mt-8 flex items-center justify-end gap-4">
      <button class="btn gray-btn" type="button">الغاء</button>
    </div>
  </div>
</div>
