<section class="custom-container">
  <div class="px-8 py-6 sm:px-28 sm:py-20 max-w-[722px] rounded-xl bg-white">
    <header>
      <img alt="" src="assets/imgs/Favicon-Interior.png" />
      <h1 class="text-[#161616] text-2xl sm:text-4xl font-bold mt-4 mb-8">
        {{ 'LOGIN_PAGE.LOGIN_LBL' | translate }}
      </h1>
    </header>
    @if (loginForm) {
      <article>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Login Mode Selection -->
          <div class="flex flex-wrap gap-4 mb-6">
            <label
              class="relative flex flex-row-reverse items-center cursor-pointer gap-2 justify-between text-[#161616]"
              for="system-radio"
            >
              {{ 'LOGIN_PAGE.SYSTEM_DATA' | translate }}
              <div class="relative w-5 h-5">
                <input
                  type="radio"
                  id="system-radio"
                  name="loginMode"
                  [checked]="selectedLoginMode === LoginMode.SYSTEM"
                  (change)="onLoginModeChange(LoginMode.SYSTEM)"
                  class="peer appearance-none h-5 w-5 cursor-pointer rounded-full border border-[var(--border-storm)] checked:border-[var(--border-forest)] transition-all"
                />
                <span
                  class="absolute bg-[#25935f] w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transform top-[50%] left-[50%] -translate-y-1/2 -translate-x-1/2"
                >
                </span>
              </div>
            </label>
            <label
              class="relative flex flex-row-reverse items-center cursor-pointer gap-2 justify-between text-[#161616]"
              for="ad-radio"
            >
              {{ 'LOGIN_PAGE.ACTIVE_DIRECTORY_DATA' | translate }}
              <div class="relative w-5 h-5">
                <input
                  type="radio"
                  id="ad-radio"
                  name="loginMode"
                  [checked]="selectedLoginMode === LoginMode.ACTIVE_DIRECTORY"
                  (change)="onLoginModeChange(LoginMode.ACTIVE_DIRECTORY)"
                  class="peer appearance-none h-5 w-5 cursor-pointer rounded-full border border-[var(--border-storm)] checked:border-[var(--border-forest)] transition-all"
                />
                <span
                  class="absolute bg-[#25935f] w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transform top-[50%] left-[50%] -translate-y-1/2 -translate-x-1/2"
                >
                </span>
              </div>
            </label>
          </div>

          <!-- System Login Form -->
          @if (selectedLoginMode === LoginMode.SYSTEM) {
            <div class="login-form-container">
              <div class="mb-6">
                <div class="relative">
                  <label for="systemUserName" class="label">{{
                    'LOGIN_PAGE.NATIONAL_ID_LBL' | translate
                  }}</label>
                  <input
                    formControlName="username"
                    id="systemUserName"
                    class="peer"
                    type="text"
                    pInputText
                    [placeholder]="'LOGIN_PAGE.NATIONAL_ID_LBL' | translate"
                    fluid="true"
                  />
                  <span
                    class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
                  ></span>
                </div>
                <app-validation-messages [control]="usernameControl"></app-validation-messages>
              </div>
              <div class="mb-10">
                <div class="relative group">
                  <label for="adPassword" class="label">
                    {{ 'LOGIN_PAGE.PASSWORD_LBL' | translate }}
                  </label>
                  <p-password
                    formControlName="password"
                    [toggleMask]="true"
                    id="adPassword"
                    [feedback]="false"
                    inputStyleClass="password-input"
                    [placeholder]="'LOGIN_PAGE.PASSWORD_LBL' | translate"
                    fluid="true"
                  ></p-password>
                  <span class="password-underline"></span>
                </div>
                <app-validation-messages [control]="passwordControl"></app-validation-messages>
              </div>
            </div>
          }

          <!-- Active Directory Login Form -->
          @if (selectedLoginMode === LoginMode.ACTIVE_DIRECTORY) {
            <div class="login-form-container">
              <div class="mb-6">
                <div class="relative">
                  <label for="adUserName" class="label">{{
                    'LOGIN_PAGE.USERNAME_LBL' | translate
                  }}</label>
                  <input
                    formControlName="username"
                    id="adUserName"
                    class="peer"
                    type="text"
                    pInputText
                    [placeholder]="'LOGIN_PAGE.USERNAME_LBL' | translate"
                    fluid="true"
                  />
                  <span
                    class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
                  ></span>
                </div>
                <app-validation-messages [control]="usernameControl"></app-validation-messages>
              </div>
              <div class="mb-10">
                <div class="relative">
                  <label for="adPassword" class="label">{{
                    'LOGIN_PAGE.PASSWORD_LBL' | translate
                  }}</label>
                  <p-password
                    formControlName="password"
                    [toggleMask]="true"
                    inputStyleClass="peer"
                    id="adPassword"
                    type="password"
                    [placeholder]="'LOGIN_PAGE.PASSWORD_LBL' | translate"
                    fluid="true"
                    [feedback]="false"
                  />
                  <span
                    class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
                  ></span>
                </div>
                <app-validation-messages [control]="passwordControl"></app-validation-messages>
              </div>
            </div>
          }

          <!-- Action Buttons -->
          <div class="mt-10 flex items-center justify-between flex-wrap gap-4">
            <button type="submit" class="btn green-btn w-full">
              {{ 'LOGIN_PAGE.LOGIN_BTN' | translate }}
            </button>
            @if (selectedLoginMode === LoginMode.SYSTEM) {
              <button
                type="button"
                class="text-[#161616] inline-flex items-center w-full justify-center min-h-[40px] px-3 rounded text-[14px] font-medium hover:bg-[#f1f1f1] transition"
                (click)="onForgotPassword()"
              >
                {{ 'RESET_PASSWORD.FORGOT_PASSWORD' | translate }}
              </button>
            }
          </div>
        </form>
      </article>
    }
  </div>
</section>
